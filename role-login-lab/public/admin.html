<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h1>Admin Dashboard</h1>
      <button id="logoutBtn" class="btn danger">Logout</button>
    </header>

    <section class="card">
      <h2>Welcome, <span id="adminName">...</span></h2>
      <p class="muted">Signed in as <strong id="adminEmail"></strong> (role: admin)</p>
    </section>

    <section class="card">
      <h2>Registered Users</h2>
      <p class="muted">These are the accounts stored in the server's memory.</p>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th></tr>
        </thead>
        <tbody id="userTableBody"></tbody>
      </table>
    </section>
  </div>

  <script>
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));

    if (!currentUser || currentUser.role !== 'admin') {
      window.location.href = '/login.html';
    } else {
      document.getElementById('adminName').textContent = currentUser.name;
      document.getElementById('adminEmail').textContent = currentUser.email;
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('currentUser');
      window.location.href = '/login.html';
    });

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const list = await res.json();
        const tbody = document.getElementById('userTableBody');

        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="4">No users yet. Create some in Postman.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td><span class="badge ${u.role}">${u.role}</span></td>
          </tr>
        `).join('');
      } catch {
        document.getElementById('userTableBody').innerHTML =
          '<tr><td colspan="4">Failed to load users.</td></tr>';
      }
    }

    if (currentUser && currentUser.role === 'admin') loadUsers();
  </script>
</body>
</html>
